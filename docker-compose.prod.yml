version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: kg-edu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kg_edu_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kg-edu-network

  # Elixir Phoenix Backend (统一服务：API + React SPA 静态文件)
  backend:
    image: registry.cn-zhangjiakou.aliyuncs.com/myelixir/kg_edu_backend:latest
    container_name: kg-edu-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=ecto://postgres:postgres@db:5432/kg_edu_dev
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - TOKEN_SIGNING_SECRET=${TOKEN_SIGNING_SECRET}
      - PHX_HOST=localhost
      - PORT=4000
      - PHX_SERVER=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - REACT_TOKEN_SECRET=${REACT_TOKEN_SECRET:-kg-edu-local-react-token-secret-change-in-prod-32}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/priv/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kg-edu-network

  # Nginx 反向代理（可选：用于 TLS 终止和负载均衡）
  nginx:
    image: nginx:alpine
    container_name: kg-edu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
    networks:
      - kg-edu-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  kg-edu-network:
    driver: bridge
